<div class="login-container">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Login - Loja Gamer 🎮</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form>

        <mat-form-field appearance="outline">
          <mat-label>Usuário</mat-label>
          <input matInput
                 name="usuario"
                 [(ngModel)]="usuario">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput
                 type="password"
                 name="senha"
                 [(ngModel)]="senha">
        </mat-form-field>

        <button mat-raised-button type="button">
          Entrar
        </button>

      </form>

    </mat-card-content>

  </mat-card>

</div>
